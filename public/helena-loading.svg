<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Helena caminhando">
  <style>
    .body { animation: bob .8s ease-in-out infinite; }
    .leg-1 { animation: step .8s ease-in-out infinite; }
    .leg-2 { animation: step .8s ease-in-out -.4s infinite; }
    .tail { transform-origin: 158px 169px; animation: tail 1.6s ease-in-out infinite; }
    .eyes { transform-origin: 120px 91px; animation: blink 4s infinite; }
    @keyframes bob { 0%, 50%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(-2px); } }
    @keyframes step { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes tail { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.08); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <ellipse cx="120" cy="213" rx="47" ry="4" fill="#7c3aed" opacity=".12"/>
