<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Helena caminhando">
  <style>
    .body { animation: bob .8s ease-in-out infinite; }
    .leg-1 { transform-origin: 111px 167px; animation: step .8s ease-in-out infinite; }
    .leg-2 { transform-origin: 139px 167px; animation: step .8s ease-in-out -.4s infinite; }
    .tail { transform-origin: 94px 164px; animation: tail 1.6s ease-in-out infinite; }
    .eyes { transform-origin: 135px 107px; animation: blink 4s infinite; }
    @keyframes bob { 0%, 50%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(-4px); } }
    @keyframes step { 0%, 100% { transform: rotate(-23deg); } 50% { transform: rotate(23deg); } }
    @keyframes tail { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.08); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <ellipse cx="124" cy="208" rx="51" ry="5" fill="#7c3aed" opacity=".12"/>
